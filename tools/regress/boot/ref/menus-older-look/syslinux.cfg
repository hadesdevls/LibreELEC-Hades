# hades-features: storage-anywhere other-disks-hidden
SAY Wait for run mode to start automatically in 10 seconds...
SAY
SAY LibreELEC Hades: type an option and press Enter
SAY ===============================================
SAY run:       the normal start (recommended). This computer's other NVMe and SATA disks stay hidden
SAY internal:  like run, and shows the internal disks, mounted read-only
SAY live:      settings and add-ons stay in memory only, gone at power off
SAY installer: installs LibreELEC Hades on a disk you choose, erasing it. Asks twice first
SAY
DEFAULT run
TIMEOUT 100
PROMPT 1
INCLUDE /hades/menu.cfg

LABEL run
  MENU LABEL Run (recommended)
  TEXT HELP
                The normal start. The other NVMe and SATA disks stay hidden.
  ENDTEXT
  KERNEL /KERNEL
  APPEND boot=UUID=2910-3854 disk=UUID=2d559a3b-5820-4f3b-b44a-5c05bd0cd045 portable quiet initcall_blacklist=nvme_init,ahci_pci_driver_init lockdown=integrity

LABEL internal
  MENU LABEL Run (internal disks read-only)
  TEXT HELP
                Like Run, and shows the internal disks, mounted read-only.
  ENDTEXT
  KERNEL /KERNEL
  APPEND boot=UUID=2910-3854 disk=UUID=2d559a3b-5820-4f3b-b44a-5c05bd0cd045 portable quiet

LABEL live
  MENU LABEL Live
  TEXT HELP
                Settings and add-ons stay in memory only, gone at power off.
  ENDTEXT
  KERNEL /KERNEL
  APPEND boot=UUID=2910-3854 live quiet vga=current initcall_blacklist=nvme_init,ahci_pci_driver_init lockdown=integrity

LABEL installer
  MENU LABEL Installer
  TEXT HELP
                Installs it on a disk you choose, erasing it. Asks twice first.
  ENDTEXT
  KERNEL /KERNEL
  APPEND boot=UUID=2910-3854 installer quiet systemd.debug_shell vga=current
