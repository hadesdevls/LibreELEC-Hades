# hades-features: storage-anywhere other-disks-hidden
if [ -f "${prefix}/hades/theme.cfg" ]; then source "${prefix}/hades/theme.cfg"; fi
set timeout="10"
set default="Run"
menuentry "Run" --class hades-run {
	terminal_output console
	search --set -f /KERNEL
	linux /KERNEL boot=UUID=2910-3854 disk=UUID=2d559a3b-5820-4f3b-b44a-5c05bd0cd045 grub_portable quiet initcall_blacklist=nvme_init,ahci_pci_driver_init lockdown=integrity
}
menuentry "Run (internal disks read-only)" --class hades-internal {
	terminal_output console
	search --set -f /KERNEL
	linux /KERNEL boot=UUID=2910-3854 disk=UUID=2d559a3b-5820-4f3b-b44a-5c05bd0cd045 grub_portable quiet
}
menuentry "Live" --class hades-live {
	terminal_output console
	search --set -f /KERNEL
	linux /KERNEL boot=UUID=2910-3854 grub_live quiet vga=current initcall_blacklist=nvme_init,ahci_pci_driver_init lockdown=integrity
}
menuentry "Installer" --class hades-installer {
	terminal_output console
	search --set -f /KERNEL
	linux /KERNEL boot=UUID=2910-3854 installer quiet systemd.debug_shell vga=current
}
