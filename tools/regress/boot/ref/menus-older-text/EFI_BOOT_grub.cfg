# hades-features: storage-anywhere other-disks-hidden
set timeout="5"
set default="Run"
menuentry "Installer" {
	search --set -f /KERNEL
	linux /KERNEL boot=UUID=2810-0627 installer quiet systemd.debug_shell vga=current
}
menuentry "Live" {
	search --set -f /KERNEL
	linux /KERNEL boot=UUID=2810-0627 grub_live quiet vga=current initcall_blacklist=nvme_init,ahci_pci_driver_init lockdown=integrity
}
menuentry "Run" {
	search --set -f /KERNEL
	linux /KERNEL boot=UUID=2810-0627 disk=UUID=8c7befbf-3afc-4d30-b66c-990df2c4f1f0 grub_portable quiet initcall_blacklist=nvme_init,ahci_pci_driver_init lockdown=integrity
}
menuentry "Run (internal disks read-only)" {
	search --set -f /KERNEL
	linux /KERNEL boot=UUID=2810-0627 disk=UUID=8c7befbf-3afc-4d30-b66c-990df2c4f1f0 grub_portable quiet
}
