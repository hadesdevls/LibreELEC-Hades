# hades-features: storage-anywhere other-disks-hidden
SAY Wait for run mode to start automatically in 5 seconds...
SAY
SAY Options
SAY =======
SAY run: boot LibreELEC using this USB memory device for storage (internal disks hidden)
SAY internal: like run, with the internal disks visible (read-only), without kernel lockdown
SAY live: boot LibreELEC using RAM for temporary storage (internal disks hidden)
SAY installer: permanently install LibreELEC to HDD/SSD
SAY
DEFAULT run
TIMEOUT 50
PROMPT 1

LABEL installer
  KERNEL /KERNEL
  APPEND boot=UUID=2810-0627 installer quiet systemd.debug_shell vga=current

LABEL live
  KERNEL /KERNEL
  APPEND boot=UUID=2810-0627 live quiet vga=current initcall_blacklist=nvme_init,ahci_pci_driver_init lockdown=integrity

LABEL run
  KERNEL /KERNEL
  APPEND boot=UUID=2810-0627 disk=UUID=8c7befbf-3afc-4d30-b66c-990df2c4f1f0 portable quiet initcall_blacklist=nvme_init,ahci_pci_driver_init lockdown=integrity

LABEL internal
  KERNEL /KERNEL
  APPEND boot=UUID=2810-0627 disk=UUID=8c7befbf-3afc-4d30-b66c-990df2c4f1f0 portable quiet
