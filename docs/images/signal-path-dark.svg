<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d">
<title id="t">How a video reaches your TV</title>
<desc id="d">The film is decoded by the graphics, Hades rebuilds the full picture with its enhancement layer and the metadata of every frame, HDMI carries it as the Dolby Vision signal, and the TV maps it in its own Dolby Vision mode. If anything does not qualify, the video plays as HDR10 or SDR, and the player information says why.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<rect x="16" y="24" width="220" height="168" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="34" y="56" font-size="12" font-weight="600" letter-spacing="1.2" fill="#9198a1">THE FILM</text>
<text x="34" y="90" font-size="14" fill="#e6edf3">Dolby Vision 5, 7 and 8.1,</text>
<text x="34" y="113" font-size="14" fill="#e6edf3">HDR10+, HDR10, HLG, SDR</text>
<text x="34" y="136" font-size="14" fill="#e6edf3">and 3D, from a file,</text>
<text x="34" y="159" font-size="14" fill="#e6edf3">a disc or a stream</text>
<line x1="240.0" y1="108.0" x2="257.0" y2="108.0" stroke="#6e7681" stroke-width="1.5"/>
<path d="M 264.0 108.0 L 256.0 103.5 L 256.0 112.5 Z" fill="#6e7681"/>
<rect x="268" y="24" width="220" height="168" rx="12" fill="#1d1a16" stroke="#6b5a43" stroke-width="1.5"/>
<text x="286" y="56" font-size="12" font-weight="600" letter-spacing="1.2" fill="#ffdeb3">HADES, ON YOUR PC</text>
<text x="286" y="90" font-size="14" fill="#e6edf3">decodes it on the graphics,</text>
<text x="286" y="113" font-size="14" fill="#e6edf3">rebuilds the full picture</text>
<text x="286" y="136" font-size="14" fill="#e6edf3">from both layers of a disc,</text>
<text x="286" y="159" font-size="14" fill="#e6edf3">with metadata for each frame</text>
<line x1="492.0" y1="108.0" x2="509.0" y2="108.0" stroke="#6e7681" stroke-width="1.5"/>
<path d="M 516.0 108.0 L 508.0 103.5 L 508.0 112.5 Z" fill="#6e7681"/>
<rect x="520" y="24" width="220" height="168" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="538" y="56" font-size="12" font-weight="600" letter-spacing="1.2" fill="#9198a1">HDMI</text>
<text x="538" y="90" font-size="14" fill="#e6edf3">the Dolby Vision signal,</text>
<text x="538" y="113" font-size="14" fill="#e6edf3">its metadata inside the</text>
<text x="538" y="136" font-size="14" fill="#e6edf3">picture, which has to</text>
<text x="538" y="159" font-size="14" fill="#e6edf3">arrive bit for bit</text>
<line x1="744.0" y1="108.0" x2="761.0" y2="108.0" stroke="#6e7681" stroke-width="1.5"/>
<path d="M 768.0 108.0 L 760.0 103.5 L 760.0 112.5 Z" fill="#6e7681"/>
<rect x="772" y="24" width="220" height="168" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="790" y="56" font-size="12" font-weight="600" letter-spacing="1.2" fill="#9198a1">YOUR TV</text>
<text x="790" y="90" font-size="14" fill="#e6edf3">in its Dolby Vision mode,</text>
<text x="790" y="113" font-size="14" fill="#e6edf3">maps each frame to its</text>
<text x="790" y="136" font-size="14" fill="#e6edf3">own screen, as with a</text>
<text x="790" y="159" font-size="14" fill="#e6edf3">Dolby Vision player</text>
<circle cx="462" cy="51" r="9" fill="none" stroke="#ffdeb3" stroke-width="1.6"/>
<circle cx="468.8" cy="45.1" r="2.6" fill="#ffdeb3"/>
<line x1="378.0" y1="196.0" x2="378.0" y2="230.0" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M 378.0 237.0 L 373.5 229.0 L 382.5 229.0 Z" fill="#6e7681"/>
<rect x="268.0" y="238" width="700" height="58" rx="10" fill="none" stroke="#3d444d" stroke-width="1" stroke-dasharray="5 4"/>
<text x="286.0" y="262" font-size="14.5" fill="#e6edf3"><tspan font-weight="600" fill="#e6edf3">If the video, the TV, the link or the driver does not qualify,</tspan></text>
<text x="286.0" y="283" font-size="14.5" fill="#9198a1">the video plays as HDR10 or SDR, with no black screen, and the player information says why.</text>
</g></svg>
