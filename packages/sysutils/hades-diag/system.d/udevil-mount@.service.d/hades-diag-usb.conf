# Hades: a drive with a folder named hades-diag at its top gets a copy of the diagnostics (hades-diag-usb@.service),
# for a system on a disk inside the PC whose screen shows nothing. Started without waiting for it: the drive is
# mounted and shared as soon as without it.
[Service]
ExecStartPost=-/usr/bin/systemctl --no-block start hades-diag-usb@%i.service
