# The update channel of LibreELEC Hades: the address of its manifest (its signature is at the same address
# with .sig after it) and the name of the channel. Every release of LibreELEC Hades on GitHub carries the
# two files; "latest" is the newest release that is not a pre-release. The settings add-on reads this
# (hades_update.py).
URL=https://github.com/hadesdevls/LibreELEC-Hades/releases/latest/download/hades-manifest.json
CHANNEL=stable
