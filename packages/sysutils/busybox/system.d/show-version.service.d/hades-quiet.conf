# Hades: LibreELEC writes the line of the version (lsb_release) on the screen at every start, unless the kernel line
# says morequiet. Written to the console, it takes the screen from the picture of the start until the interface starts:
# the kernel keeps what is on the screen until text is written to the console (FRAMEBUFFER_CONSOLE_DEFERRED_TAKEOVER),
# and then shows the console, black, with that line. Here it is written only where the kernel line says
# hades.showversion (added by hand to an entry of the boot menu), with the diagnostics on or off. The version is in
# every folder of the diagnostics (build.txt) and in the journal; with an error, the init and the emergency shells
# write it with the error (hades_version_line in the init, emergency.service.d and rescue.service.d). The journal says
# when this was skipped ("show-version.service skipped, unmet condition check").
[Unit]
ConditionKernelCommandLine=hades.showversion
