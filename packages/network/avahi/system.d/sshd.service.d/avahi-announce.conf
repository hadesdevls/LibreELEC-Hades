# Hades: announce SSH and SFTP over mDNS only while sshd runs
[Service]
ExecStartPost=-/bin/sh -c 'mkdir -p /run/libreelec/avahi-services && cp /usr/share/avahi/sshd/*.service /run/libreelec/avahi-services/ && /usr/sbin/avahi-daemon --reload'
ExecStopPost=-/bin/sh -c 'rm -f /run/libreelec/avahi-services/ssh.service /run/libreelec/avahi-services/sftp-ssh.service; /usr/sbin/avahi-daemon --reload'
