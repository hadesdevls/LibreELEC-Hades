# Hades: the driver of the ASUS Xonar sound cards with a C-Media CMI8788 (snd_virtuoso) starts after the driver of the
# NVIDIA card has started: some starts of a PC with an RTX 5090 and a Xonar Essence STX II stopped while both drivers
# started at the same moment (issue 14 of LibreELEC Hades; /usr/lib/nvidia/after-nvidia says why and what it waits for).
install snd_virtuoso /usr/lib/nvidia/after-nvidia snd_virtuoso $CMDLINE_OPTS
