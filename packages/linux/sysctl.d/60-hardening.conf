# LibreELEC Hades: settings of the kernel that make the system harder to attack, on top of systemd's
# (50-default.conf). Each one keeps its function for root, under which the media centre and the services
# of the system run. To change one, put a file with the same name in /storage/.config/sysctl.d (it
# replaces this one), or one whose name sorts after it (for example 99-mine.conf).

# No ICMP redirects are taken: a device on the network cannot tell the system to send its traffic through
# that device. (The lines with * also change the interfaces that exist already, and "all".)
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.*.accept_redirects = 0
-net.ipv6.conf.default.accept_redirects = 0
-net.ipv6.conf.*.accept_redirects = 0

# A connection in TIME-WAIT is not closed by a stray reset (RFC 1337).
net.ipv4.tcp_rfc1337 = 1

# The kernel log and the addresses of the kernel are for root only (the services that do not run as root
# have nothing to read there).
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 1

# A program without privileges cannot load a line discipline module by asking for it on a terminal (root
# can, which is what Bluetooth over a serial line and PPP use).
dev.tty.ldisc_autoload = 0
