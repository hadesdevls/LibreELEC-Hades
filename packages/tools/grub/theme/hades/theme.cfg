# LibreELEC Hades: the look of the boot menu (packages/tools/grub/theme, written by
# make-boot-theme.py). A theme is used only in the mode it is drawn for, and the mode of the
# firmware is kept where it has one.
# The fonts: GRUB started with Secure Boot is locked down and loads a font only from inside its
# own program (the memdisk of bootx64.efi, packages/tools/grub); otherwise the ones here.
if [ "${lockdown}" = "y" ]; then
  set hades_fonts="(memdisk)/fonts"
else
  set hades_fonts="${prefix}/hades/fonts"
fi
if loadfont "${hades_fonts}/jost-26.pf2"; then
  loadfont "${hades_fonts}/jost-17.pf2"
  loadfont "${hades_fonts}/jost-16.pf2"
  loadfont "${hades_fonts}/jost-19.pf2"
  loadfont "${hades_fonts}/jost-20.pf2"
  loadfont "${hades_fonts}/jost-18.pf2"
  loadfont "${hades_fonts}/jost-22.pf2"
  loadfont "${hades_fonts}/jost-25.pf2"
  loadfont "${hades_fonts}/jost-29.pf2"
  loadfont "${hades_fonts}/jost-35.pf2"
  loadfont "${hades_fonts}/jost-39.pf2"
  loadfont "${hades_fonts}/jost-52.pf2"
  set gfxterm_font="Jost Regular 16"
  set gfxmode=auto
  if terminal_output gfxterm; then
    if [ "${gfxterm_mode}" = "1920x1080" ]; then
      set theme="${prefix}/hades/1920x1080/theme.txt"
      set hades_boot="${prefix}/hades/1920x1080/boot.png"
      set hades_lines="1080"
    elif [ "${gfxterm_mode}" = "1280x720" ]; then
      set theme="${prefix}/hades/1280x720/theme.txt"
      set hades_boot="${prefix}/hades/1280x720/boot.png"
      set hades_lines="720"
    elif [ "${gfxterm_mode}" = "1024x768" ]; then
      set theme="${prefix}/hades/1024x768/theme.txt"
      set hades_boot="${prefix}/hades/1024x768/boot.png"
      set hades_lines="768"
    elif [ "${gfxterm_mode}" = "1280x800" ]; then
      set theme="${prefix}/hades/1280x800/theme.txt"
      set hades_boot="${prefix}/hades/1280x800/boot.png"
      set hades_lines="800"
    elif [ "${gfxterm_mode}" = "1280x1024" ]; then
      set theme="${prefix}/hades/1280x1024/theme.txt"
      set hades_boot="${prefix}/hades/1280x1024/boot.png"
      set hades_lines="1024"
    elif [ "${gfxterm_mode}" = "1360x768" ]; then
      set theme="${prefix}/hades/1360x768/theme.txt"
      set hades_boot="${prefix}/hades/1360x768/boot.png"
      set hades_lines="768"
    elif [ "${gfxterm_mode}" = "1366x768" ]; then
      set theme="${prefix}/hades/1366x768/theme.txt"
      set hades_boot="${prefix}/hades/1366x768/boot.png"
      set hades_lines="768"
    elif [ "${gfxterm_mode}" = "1440x900" ]; then
      set theme="${prefix}/hades/1440x900/theme.txt"
      set hades_boot="${prefix}/hades/1440x900/boot.png"
      set hades_lines="900"
    elif [ "${gfxterm_mode}" = "1600x900" ]; then
      set theme="${prefix}/hades/1600x900/theme.txt"
      set hades_boot="${prefix}/hades/1600x900/boot.png"
      set hades_lines="900"
    elif [ "${gfxterm_mode}" = "1600x1200" ]; then
      set theme="${prefix}/hades/1600x1200/theme.txt"
      set hades_boot="${prefix}/hades/1600x1200/boot.png"
      set hades_lines="1200"
    elif [ "${gfxterm_mode}" = "1680x1050" ]; then
      set theme="${prefix}/hades/1680x1050/theme.txt"
      set hades_boot="${prefix}/hades/1680x1050/boot.png"
      set hades_lines="1050"
    elif [ "${gfxterm_mode}" = "1920x1200" ]; then
      set theme="${prefix}/hades/1920x1200/theme.txt"
      set hades_boot="${prefix}/hades/1920x1200/boot.png"
      set hades_lines="1200"
    elif [ "${gfxterm_mode}" = "2560x1080" ]; then
      set theme="${prefix}/hades/2560x1080/theme.txt"
      set hades_boot="${prefix}/hades/2560x1080/boot.png"
      set hades_lines="1080"
    elif [ "${gfxterm_mode}" = "2560x1440" ]; then
      set theme="${prefix}/hades/2560x1440/theme.txt"
      set hades_boot="${prefix}/hades/2560x1440/boot.png"
      set hades_lines="1440"
    elif [ "${gfxterm_mode}" = "2560x1600" ]; then
      set theme="${prefix}/hades/2560x1600/theme.txt"
      set hades_boot="${prefix}/hades/2560x1600/boot.png"
      set hades_lines="1600"
    elif [ "${gfxterm_mode}" = "3840x2160" ]; then
      set theme="${prefix}/hades/3840x2160/theme.txt"
      set hades_boot="${prefix}/hades/3840x2160/boot.png"
      set hades_lines="2160"
    fi
  fi
  if [ -z "${theme}" ]; then
    terminal_output console
    set gfxmode=1920x1080,1280x720,1024x768
    if terminal_output gfxterm; then
      if [ "${gfxterm_mode}" = "1920x1080" ]; then
        set theme="${prefix}/hades/1920x1080/theme.txt"
        set hades_boot="${prefix}/hades/1920x1080/boot.png"
        set hades_lines="1080"
      elif [ "${gfxterm_mode}" = "1280x720" ]; then
        set theme="${prefix}/hades/1280x720/theme.txt"
        set hades_boot="${prefix}/hades/1280x720/boot.png"
        set hades_lines="720"
      elif [ "${gfxterm_mode}" = "1024x768" ]; then
        set theme="${prefix}/hades/1024x768/theme.txt"
        set hades_boot="${prefix}/hades/1024x768/boot.png"
        set hades_lines="768"
      else
        terminal_output console
      fi
    fi
  fi
fi
# The picture of the start, the background of the terminal (see make-boot-theme.py: write_cfg)
if [ -n "${theme}" ]; then
  if [ -f "/oemsplash-${hades_lines}.png" ]; then
    set hades_start="/oemsplash-${hades_lines}.png"
  elif [ -f "/oemsplash-1080.png" ]; then
    set hades_start="/oemsplash-1080.png"
  elif [ -f "/oemsplash.png" ]; then
    set hades_start="/oemsplash.png"
  fi
  if [ -n "${hades_start}" ]; then
    if background_image "${hades_start}"; then
      set quiet_start=1
    fi
  fi
  if [ "${quiet_start}" != "1" ]; then
    if background_image -m normal "${hades_boot}"; then
      set quiet_start=1
    fi
  fi
fi
