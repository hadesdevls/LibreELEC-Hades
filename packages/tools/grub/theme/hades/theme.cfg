# LibreELEC Hades: the look of the boot menu (packages/tools/grub/theme, written by
# make-boot-theme.py). A theme is used only in the mode it is drawn for, and the mode of the
# firmware is kept where it has one.
if loadfont "${prefix}/hades/fonts/jost-26.pf2"; then
  loadfont "${prefix}/hades/fonts/jost-17.pf2"
  loadfont "${prefix}/hades/fonts/jost-16.pf2"
  loadfont "${prefix}/hades/fonts/jost-19.pf2"
  loadfont "${prefix}/hades/fonts/jost-20.pf2"
  loadfont "${prefix}/hades/fonts/jost-18.pf2"
  loadfont "${prefix}/hades/fonts/jost-22.pf2"
  loadfont "${prefix}/hades/fonts/jost-25.pf2"
  loadfont "${prefix}/hades/fonts/jost-29.pf2"
  loadfont "${prefix}/hades/fonts/jost-35.pf2"
  loadfont "${prefix}/hades/fonts/jost-39.pf2"
  loadfont "${prefix}/hades/fonts/jost-52.pf2"
  set gfxterm_font="Jost Regular 16"
  set gfxmode=auto
  if terminal_output gfxterm; then
    if [ "${gfxterm_mode}" = "1920x1080" ]; then
      set theme="${prefix}/hades/1920x1080/theme.txt"
    elif [ "${gfxterm_mode}" = "1280x720" ]; then
      set theme="${prefix}/hades/1280x720/theme.txt"
    elif [ "${gfxterm_mode}" = "1024x768" ]; then
      set theme="${prefix}/hades/1024x768/theme.txt"
    elif [ "${gfxterm_mode}" = "1280x800" ]; then
      set theme="${prefix}/hades/1280x800/theme.txt"
    elif [ "${gfxterm_mode}" = "1280x1024" ]; then
      set theme="${prefix}/hades/1280x1024/theme.txt"
    elif [ "${gfxterm_mode}" = "1360x768" ]; then
      set theme="${prefix}/hades/1360x768/theme.txt"
    elif [ "${gfxterm_mode}" = "1366x768" ]; then
      set theme="${prefix}/hades/1366x768/theme.txt"
    elif [ "${gfxterm_mode}" = "1440x900" ]; then
      set theme="${prefix}/hades/1440x900/theme.txt"
    elif [ "${gfxterm_mode}" = "1600x900" ]; then
      set theme="${prefix}/hades/1600x900/theme.txt"
    elif [ "${gfxterm_mode}" = "1600x1200" ]; then
      set theme="${prefix}/hades/1600x1200/theme.txt"
    elif [ "${gfxterm_mode}" = "1680x1050" ]; then
      set theme="${prefix}/hades/1680x1050/theme.txt"
    elif [ "${gfxterm_mode}" = "1920x1200" ]; then
      set theme="${prefix}/hades/1920x1200/theme.txt"
    elif [ "${gfxterm_mode}" = "2560x1080" ]; then
      set theme="${prefix}/hades/2560x1080/theme.txt"
    elif [ "${gfxterm_mode}" = "2560x1440" ]; then
      set theme="${prefix}/hades/2560x1440/theme.txt"
    elif [ "${gfxterm_mode}" = "2560x1600" ]; then
      set theme="${prefix}/hades/2560x1600/theme.txt"
    elif [ "${gfxterm_mode}" = "3840x2160" ]; then
      set theme="${prefix}/hades/3840x2160/theme.txt"
    fi
  fi
  if [ -z "${theme}" ]; then
    terminal_output console
    set gfxmode=1920x1080,1280x720,1024x768
    if terminal_output gfxterm; then
      if [ "${gfxterm_mode}" = "1920x1080" ]; then
        set theme="${prefix}/hades/1920x1080/theme.txt"
      elif [ "${gfxterm_mode}" = "1280x720" ]; then
        set theme="${prefix}/hades/1280x720/theme.txt"
      elif [ "${gfxterm_mode}" = "1024x768" ]; then
        set theme="${prefix}/hades/1024x768/theme.txt"
      else
        terminal_output console
      fi
    fi
  fi
fi
