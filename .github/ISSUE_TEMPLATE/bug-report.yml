name: Bug report
description: A problem with LibreELEC Hades. Un problema con LibreELEC Hades.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting it. You can write in English or in Spanish. *Puedes escribir en inglés o en español.*

        LibreELEC Hades is not made or supported by LibreELEC or Kodi: report its problems here, not to them. If the same problem also happens with an official LibreELEC image, it belongs to LibreELEC or Kodi and can be reported there, against their image.

        Before you report, look at "Known limits" in the [README](https://github.com/hadesdevls/LibreELEC-Hades/blob/main/README.md#known-limits).

  - type: input
    id: build
    attributes:
      label: Build
      description: "*Settings > System information*, or the `PRETTY_NAME` and `BUILD_ID` lines of `/etc/os-release`."
      placeholder: "LibreELEC (Hades 1.0 RC2): devel-..."
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Graphics, display and connection
      description: The graphics card, or the processor if it was its integrated graphics; the model of the TV or display; and how they are connected (straight to the TV, or through an AV receiver or a sound bar).
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you played (where from, the container, the Dolby Vision profile or the HDR format, the audio format), what you expected, and what you saw or heard instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Attach the Kodi log, or the folder `hades-diag` of the drive as a zip file if the diagnostic
        switch was on (drag the file into this box). Look through it first: it is filtered, but it is
        yours to check. Without a log, most problems cannot be found.
    validations:
      required: false
